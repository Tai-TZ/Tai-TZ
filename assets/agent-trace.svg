<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="t d"><title id="t">About me, streamed as an agent run</title><desc id="d">A terminal streams a LangGraph-style run that introduces Nguyen Thanh Tai node by node while a small graph lights up.</desc><style>.ln{opacity:0;animation:ln 17.0s ease-out infinite both;animation-delay:var(--d)}@keyframes ln{0%{opacity:0;transform:translateX(-10px)}3%{opacity:1;transform:none}86%{opacity:1}92%,100%{opacity:0}}.lit{animation:lit 17.0s ease-out infinite both;animation-delay:var(--d)}@keyframes lit{0%{fill-opacity:.08;stroke-opacity:.35}3%{fill-opacity:.95;stroke-opacity:1}86%{fill-opacity:.95;stroke-opacity:1}92%,100%{fill-opacity:.08;stroke-opacity:.35}}.blink{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}.flow{stroke-dasharray:4 5;animation:flow .9s linear infinite}@keyframes flow{to{stroke-dashoffset:-9}}.live{animation:live 1.6s ease-in-out infinite}@keyframes live{50%{opacity:.25}}@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style><defs><linearGradient id="trace-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1530"/><stop offset="1" stop-color="#060912"/></linearGradient><radialGradient id="trace-glow" cx="0.5" cy="0" r="0.8"><stop offset="0" stop-color="#7c3aed" stop-opacity="0.28"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="470" rx="20" fill="url(#trace-bg)"/><rect width="1200" height="470" rx="20" fill="url(#trace-glow)"/><rect x="0.5" y="0.5" width="1199" height="469" rx="19.5" fill="none" stroke="#1d2947"/><line x1="0" y1="52" x2="1200" y2="52" stroke="#1d2947"/><circle cx="30" cy="26" r="6.5" fill="#f472b6"/><circle cx="52" cy="26" r="6.5" fill="#fbbf24"/><circle cx="74" cy="26" r="6.5" fill="#a3e635"/><text x="600.0" y="31" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'Courier New',monospace" font-size="14" fill="#8b9bb4">tai.agent — langgraph stream</text><circle class="live" cx="1126" cy="26" r="5" fill="#f472b6"/><text x="1138" y="31" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'Courier New',monospace" font-size="13" fill="#8b9bb4">live</text><text x="40" y="96" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'Courier New',monospace" font-size="17" fill="#e6edf7"><tspan fill="#a3e635">$</tspan> python -m tai.agent --stream <tspan fill="#4a5a7a"># introduce yourself</tspan></text><g class="ln" style="--d:0.90s"><text x="40" y="138" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'Courier New',monospace" font-size="16.5" xml:space="preserve"><tspan fill="#4a5a7a">[00]</tspan> <tspan fill="#a78bfa">◆</tspan> <tspan fill="#a78bfa" font-weight="700">START</tspan>  <tspan fill="#4a5a7a">thread_id=tai-tz · checkpointer=memory</tspan></text></g><g class="ln" style="--d:2.05s"><text x="40" y="175" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'Courier New',monospace" font-size="16.5" xml:space="preserve"><tspan fill="#4a5a7a">[01]</tspan> <tspan fill="#22d3ee">▸</tspan> <tspan fill="#8b9bb4">node:</tspan><tspan fill="#22d3ee" font-weight="700">whoami</tspan>  <tspan fill="#4a5a7a">→</tspan> <tspan fill="#e6edf7">Nguyen Thanh Tai · Software / AI Engineer</tspan></text><text x="820" y="175" text-anchor="end" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'Courier New',monospace" font-size="14" fill="#4a5a7a">38ms</text></g><g class="ln" style="--d:3.20s"><text x="40" y="212" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'Courier New',monospace" font-size="16.5" xml:space="preserve"><tspan fill="#4a5a7a">[02]</tspan> <tspan fill="#f472b6">▸</tspan> <tspan fill="#8b9bb4">node:</tspan><tspan fill="#f472b6" font-weight="700">locate</tspan>  <tspan fill="#4a5a7a">→</tspan> <tspan fill="#e6edf7">Hanoi, Vietnam · UTC+7</tspan></t