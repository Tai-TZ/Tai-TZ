-size="12">1</text><text x="98" y="247" class="m i" font-size="14" xml:space="preserve"><tspan font-weight="700">from</tspan> langgraph.graph <tspan font-weight="700">import</tspan> <tspan class="r" font-weight="700">StateGraph</tspan>, <tspan class="r" font-weight="700">START</tspan>, <tspan class="r" font-weight="700">END</tspan></text><text x="74" y="272" text-anchor="end" class="m q" font-size="12">2</text><text x="74" y="297" text-anchor="end" class="m q" font-size="12">3</text><text x="98" y="297" class="m i" font-size="14" xml:space="preserve">g = <tspan class="r" font-weight="700">StateGraph</tspan>(Tai)</text><text x="74" y="322" text-anchor="end" class="m q" font-size="12">4</text><text x="98" y="322" class="m i" font-size="14" xml:space="preserve">g.add_node(<tspan class="r">&quot;whoami&quot;</tspan>, whoami)       <tspan class="q" font-style="italic"># Nguyen Thanh Tai</tspan></text><text x="74" y="347" text-anchor="end" class="m q" font-size="12">5</text><text x="98" y="347" class="m i" font-size="14" xml:space="preserve"><tspan font-weight="700">for</tspan> n <tspan font-weight="700">in</tspan> (<tspan class="r">&quot;locate&quot;</tspan>, <tspan class="r">&quot;focus&quot;</tspan>, <tspan class="r">&quot;stack&quot;</tspan>, <tspan class="r">&quot;habits&quot;</tspan>):</text><text x="74" y="372" text-anchor="end" class="m q" font-size="12">6</text><text x="98" y="372" class="m i" font-size="14" xml:space="preserve">    g.add_node(n, NODES[n])</text><text x="74" y="397" text-anchor="end" class="m q" font-size="12">7</text><text x="98" y="397" class="m i" font-size="14" xml:space="preserve">    g.add_edge(<tspan class="r">&quot;whoami&quot;</tspan>, n)        <tspan class="q" font-style="italic"># fan-out</tspan></text><text x="74" y="422" text-anchor="end" class="m q" font-size="12">8</text><text x="98" y="422" class="m i" font-size="14" xml:space="preserve">    g.add_edge(n, <tspan class="r">&quot;runtime&quot;</tspan>)       <tspan class="q" font-s