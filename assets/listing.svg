;Hanoi&quot; tz=&quot;UTC+7&quot;</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4750;0.4850;.97;1" dur="15.0s" repeatCount="indefinite"/></text><text x="716" y="364" class="m" font-size="12.5" opacity="0" xml:space="preserve"><tspan class="o" fill-opacity=".55" font-weight="700">[focus]  </tspan><tspan class="o"> &quot;LLM agents&quot;</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5100;0.5200;.97;1" dur="15.0s" repeatCount="indefinite"/></text><text x="716" y="394" class="m" font-size="12.5" opacity="0" xml:space="preserve"><tspan class="o" fill-opacity=".55" font-weight="700">[stack]  </tspan><tspan class="o"> py · ts · torch · fastapi</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5450;0.5550;.97;1" dur="15.0s" repeatCount="indefinite"/></text><text x="716" y="424" class="m" font-size="12.5" opacity="0" xml:space="preserve"><tspan class="o" fill-opacity=".55" font-weight="700">[habits] </tspan><tspan class="o"> vscode · zsh</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5800;0.5900;.97;1" dur="15.0s" repeatCount="indefinite"/></text><text x="716" y="454" class="m" font-size="12.5" opacity="0" xml:space="preserve"><tspan class="o" fill-opacity=".55" font-weight="700">[runtime]</tspan><tspan class="o">  learning=always</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6150;0.6250;.97;1" dur="15.0s" repeatCount="indefinite"/></text><text x="716" y="484" class="m" font-size="12.5" opacity="0" xml:space="preserve"><tspan fill="#FF5A5F" font-weight="700">✔ END    </tspan><tspan class="o"> coffee=inf</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6500;0.6600;.97;1" dur="15.0s" repeatCount="indefinite"/></text><rect x="716" y="502" width="8" height="15" class="r"><animate attributeName="opacity" values="1;0;1" dur="1s" calcMode="discrete" repeatCount="indefinite"/></rect></svg>
